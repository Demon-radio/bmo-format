name: bmo-ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: all suites (python tests/run_all.py)
        run: python tests/run_all.py
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: js sdk suite
        run: node --test sdk/js/test.js
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo conformance (default + codec/signature features)
        run: cd core/rust && cargo test && cargo test --features "codecs signatures"
      - name: cli smoke
        run: cd core/rust && cargo run --release -- validate ../../tests/golden/hello.bmo
  interop:
    needs: rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: build rust cli (with codecs)
        run: cd core/rust && cargo build --features codecs
      - name: cross-implementation interop (required)
        env:
          BMO_REQUIRE_RUST: "1"
          BMO_REQUIRE_CODECS: "1"
          BMO_RUST_BIN: ${{ github.workspace }}\core\rust\target\debug\bmo.exe
        run: python tests/interop/test_rust_interop.py
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: build frozen app
        run: python -m PyInstaller BMOViewer.spec --noconfirm
      - name: verify frozen app (required)
        env:
          BMO_REQUIRE_APP: "1"
        run: python tests/test_exe.py
